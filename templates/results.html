<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Elite Resume</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 Helvetica, Arial, sans-serif;
    background: #f4f4f2;
    min-height: 100vh;
  }

  /* ===================== LOADING SCREEN ===================== */
  .loading-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
    text-align: center;
  }
  .loading-card {
    background: #ffffff;
    border-radius: 16px;
    padding: 3rem 2.5rem;
    max-width: 440px;
    width: 100%;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
  }
  .spinner {
    width: 56px;
    height: 56px;
    border: 4px solid #e6e6e3;
    border-top-color: #2C2C2A;
    border-radius: 50%;
    margin: 0 auto 1.75rem;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .loading-title {
    font-size: 20px;
    font-weight: 600;
    color: #2C2C2A;
    margin-bottom: 8px;
  }
  .loading-step {
    font-size: 14px;
    color: #6b6b68;
    margin-bottom: 24px;
    min-height: 20px;
    transition: opacity 0.3s;
  }
  .progress-track {
    width: 100%;
    height: 6px;
    background: #ece9e4;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .progress-fill {
    height: 100%;
    background: #2C2C2A;
    border-radius: 4px;
    width: 8%;
    transition: width 1.2s ease;
  }
  .progress-pct {
    font-size: 12px;
    color: #9c9a96;
  }
  .step-list {
    margin-top: 1.75rem;
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .step-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: #9c9a96;
    transition: color 0.3s;
  }
  .step-item.active { color: #2C2C2A; font-weight: 500; }
  .step-item.complete { color: #2C2C2A; }
  .step-dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid #ece9e4;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    transition: all 0.3s;
  }
  .step-item.active .step-dot {
    border-color: #2C2C2A;
    background: #2C2C2A;
    animation: pulse 1.2s ease-in-out infinite;
  }
  .step-item.complete .step-dot {
    border-color: #2C2C2A;
    background: #2C2C2A;
    color: #fff;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .loading-hint {
    margin-top: 1.5rem;
    font-size: 12px;
    color: #b3b1ac;
    line-height: 1.6;
  }

  /* ===================== ERROR SCREEN ===================== */
  .error-card {
    background: #ffffff;
    border-radius: 16px;
    padding: 2.5rem;
    max-width: 480px;
    width: 100%;
    text-align: center;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
  }
  .error-icon {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #fce8e6;
    color: #c5453a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 700;
    margin: 0 auto 1rem;
  }
  .error-title {
    font-size: 18px;
    font-weight: 600;
    color: #2C2C2A;
    margin-bottom: 8px;
  }
  .error-message {
    font-size: 14px;
    color: #6b6b68;
    line-height: 1.6;
    margin-bottom: 1.5rem;
  }
  .retry-btn {
    background: #2C2C2A;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px 24px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
  }
  .retry-btn:hover { background: #444441; }

  /* ===================== RESUME DISPLAY ===================== */
  #resume-container {
    display: none;
  }
  .resume-toolbar {
    position: sticky;
    top: 0;
    background: #ffffff;
    border-bottom: 1px solid #e6e6e3;
    padding: 12px 24px;
    display: flex;
    justify-content: center;
    gap: 12px;
    z-index: 10;
  }
  .toolbar-btn {
    background: #2C2C2A;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
  }
  .toolbar-btn:hover { background: #444441; }
  .toolbar-btn.secondary {
    background: transparent;
    color: #2C2C2A;
    border: 1px solid #d6d4cf;
  }
  .toolbar-btn.secondary:hover { background: #f4f4f2; }

  @media print {
    .resume-toolbar { display: none; }
  }
</style>
</head>
<body>

<div id="loading-screen" class="loading-wrap">
  <div class="loading-card">
    <div class="spinner"></div>
    <div class="loading-title">Building your elite resume</div>
    <div class="loading-step" id="loading-step-text">Starting up...</div>

    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <div class="progress-pct" id="progress-pct">8%</div>

    <div class="step-list">
      <div class="step-item active" id="step-1">
        <span class="step-dot"></span>
        <span>Specialist writer drafting your resume</span>
      </div>
      <div class="step-item" id="step-2">
        <span class="step-dot"></span>
        <span>FAANG critic sharpening every bullet</span>
      </div>
      <div class="step-item" id="step-3">
        <span class="step-dot"></span>
        <span>ATS guard finalizing formatting</span>
      </div>
    </div>

    <div class="loading-hint">
      This usually takes 60-90 seconds. Please don't close this tab.
    </div>
  </div>
</div>

<div id="error-screen" class="loading-wrap" style="display:none;">
  <div class="error-card">
    <div class="error-icon">!</div>
    <div class="error-title">Something went wrong</div>
    <div class="error-message" id="error-message-text">
      We couldn't generate your resume. Please try again.
    </div>
    <button class="retry-btn" onclick="window.location.reload()">Try again</button>
  </div>
</div>

<div id="resume-container">
  <div class="resume-toolbar">
    <button class="toolbar-btn" onclick="window.print()">Download / Print PDF</button>
    <button class="toolbar-btn secondary" onclick="window.location.href='/'">Back to home</button>
  </div>
  <div id="resume-html"></div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const resumeId = params.get('id');

const loadingScreen = document.getElementById('loading-screen');
const errorScreen = document.getElementById('error-screen');
const resumeContainer = document.getElementById('resume-container');
const stepText = document.getElementById('loading-step-text');
const progressFill = document.getElementById('progress-fill');
const progressPct = document.getElementById('progress-pct');

const steps = [
  { el: document.getElementById('step-1'), text: 'Specialist writer drafting your resume', pct: 15 },
  { el: document.getElementById('step-2'), text: 'FAANG critic sharpening every bullet', pct: 50 },
  { el: document.getElementById('step-3'), text: 'ATS guard finalizing formatting', pct: 85 }
];

let currentStep = 0;
let pollCount = 0;
let stepInterval;

function advanceStep() {
  if (currentStep < steps.length) {
    if (currentStep > 0) {
      steps[currentStep - 1].el.classList.remove('active');
      steps[currentStep - 1].el.classList.add('complete');
      steps[currentStep - 1].el.querySelector('.step-dot').textContent = '\\u2713';
    }
    steps[currentStep].el.classList.add('active');
    stepText.textContent = steps[currentStep].text;
    progressFill.style.width = steps[currentStep].pct + '%';
    progressPct.textContent = steps[currentStep].pct + '%';
    currentStep++;
  }
}

function showError(message) {
  clearInterval(stepInterval);
  loadingScreen.style.display = 'none';
  errorScreen.style.display = 'flex';
  document.getElementById('error-message-text').textContent = message ||
    "We couldn't generate your resume. Please try again.";
}

function showResume(html) {
  clearInterval(stepInterval);
  // Mark all steps complete
  steps.forEach(s => {
    s.el.classList.remove('active');
    s.el.classList.add('complete');
    s.el.querySelector('.step-dot').textContent = '\\u2713';
  });
  progressFill.style.width = '100%';
  progressPct.textContent = '100%';

  setTimeout(() => {
    loadingScreen.style.display = 'none';
    resumeContainer.style.display = 'block';
    document.getElementById('resume-html').innerHTML = html;
  }, 400);
}

if (!resumeId) {
  showError('No resume ID provided. Please generate a resume first.');
} else {
  // Advance through steps visually every ~20 seconds
  // (real progress is determined by polling below)
  advanceStep();
  stepInterval = setInterval(() => {
    if (currentStep < steps.length) advanceStep();
  }, 22000);

  function poll() {
    pollCount++;
    fetch('/check-status?id=' + encodeURIComponent(resumeId))
      .then(r => r.json())
      .then(data => {
        if (data.status === 'done') {
          showResume(data.html);
        } else if (data.status === 'error') {
          showError(data.error);
        } else if (data.status === 'not_found') {
          showError('Resume not found or expired. Please generate a new one.');
        } else {
          // still pending
          if (pollCount > 60) {
            // ~3 minutes of polling at 3s intervals
            showError('This is taking longer than expected. Please try again.');
          } else {
            setTimeout(poll, 3000);
          }
        }
      })
      .catch(err => {
        if (pollCount > 5) {
          showError('Connection error. Please refresh the page.');
        } else {
          setTimeout(poll, 3000);
        }
      });
  }

  poll();
}
</script>

</body>
</html>
